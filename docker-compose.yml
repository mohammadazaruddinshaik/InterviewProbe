services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewprobe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interviewprobe
    ports:
      - "5432:5432"
    volumes:
      - interviewprobe-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interviewprobe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  interviewprobe-postgres-data:
